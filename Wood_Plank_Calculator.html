<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#70421f"><title>Agarwal Woodcraft - Plank Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee6;color:#21180f;font-family:Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:12px}header{background:#f8e8cb;border:1px solid #dec49c;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}h1{font-size:clamp(22px,4vw,34px);margin:4px;color:#4e2d15}.rate-actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.ratebox{background:white;border-radius:10px;padding:10px}label{display:block;font-weight:bold;margin-bottom:6px}input{font:inherit}#rate{width:100%;padding:10px;border:1px solid #ccc;border-radius:7px;font-size:18px}button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:12px 8px;cursor:pointer}.add{background:#247a43;color:white}.clear{background:#b92e2e;color:white}.calc{background:#dbe7f2;color:#172d42}.tablewrap{overflow-x:auto;background:white;border:1px solid #ddd;border-radius:10px}table{width:100%;min-width:740px;border-collapse:collapse}thead{background:#9a673b;color:white}th{padding:11px 7px;font-size:13px}td{padding:7px;text-align:center;border-bottom:1px solid #eee}tbody tr:nth-child(even){background:#fffaf3}td input{width:100%;min-width:65px;padding:10px 6px;border:1px solid #d0c8bd;border-radius:6px;font-size:16px}.readonly{background:#f1f1f1;border-radius:6px;padding:10px 4px}.del{background:#fce4e4;color:#9d2020;padding:8px 12px}tfoot{background:#e6f2df;font-weight:bold}tfoot td{padding:13px 6px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.sumcard{background:white;border:1px solid #ddd;border-radius:10px;padding:14px}.sumlabel{font-size:13px;color:#666;font-weight:bold}.sumvalue{font-size:clamp(22px,5vw,30px);font-weight:bold;color:#24502b;margin-top:5px;overflow-wrap:anywhere}.note{text-align:center;font-size:12px;color:#655a4e;margin:12px}@media(max-width:600px){.app{padding:8px}.rate-actions{grid-template-columns:1fr 1fr}.ratebox{grid-column:1/-1}button{font-size:14px}.summary{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app">
<header><div style="font-size:32px">🪵</div><h1>Agarwal Woodcraft Industries</h1><div>Wood Plank Calculator</div></header>
<div class="rate-actions"><div class="ratebox"><label for="rate">Rate per sq.ft (₹)</label><input id="rate" type="number" min="0" step="any" value="100"></div><button class="add" id="addBtn">＋ Add Row</button><button class="clear" id="clearBtn">Clear All</button><button class="calc" id="calcBtn">Calculate</button></div>
<div class="tablewrap"><table><thead><tr><th>#</th><th>Length (feet)</th><th>Width (inches)</th><th>Qty (pcs)</th><th>Sq.ft / pc</th><th>Total Sq.ft</th><th>Amount (₹)</th><th>Action</th></tr></thead><tbody id="rows"></tbody><tfoot><tr><td colspan="5">TOTAL</td><td id="totalSqft">0.00</td><td id="grandTotal">₹0.00</td><td></td></tr></tfoot></table></div>
<div class="summary"><div class="sumcard"><div class="sumlabel">TOTAL SQUARE FEET</div><div class="sumvalue" id="summarySqft">0.00</div></div><div class="sumcard"><div class="sumlabel">GRAND TOTAL</div><div class="sumvalue" id="summaryAmount">₹0.00</div></div></div><div class="note">Formula: Length (ft) × Width (inches) ÷ 12 × Quantity × Rate</div></div>
<script>
const rows=document.getElementById('rows'),rate=document.getElementById('rate');let counter=0;
function money(n){return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function renumber(){[...rows.children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}
function addRow(l='',w='',q='1'){let tr=document.createElement('tr');tr.innerHTML='<td class="num"></td><td><input class="len" type="number" min="0" step="any" placeholder="Feet"></td><td><input class="wid" type="number" min="0" step="any" placeholder="Inches"></td><td><input class="qty" type="number" min="0" step="1" value="1"></td><td class="per readonly">0.00</td><td class="sq readonly">0.00</td><td class="amt readonly">₹0.00</td><td><button class="del" type="button">✕</button></td>';tr.querySelector('.len').value=l;tr.querySelector('.wid').value=w;tr.querySelector('.qty').value=q;tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));tr.querySelector('.del').onclick=()=>{tr.remove();if(!rows.children.length)addRow();renumber();calc()};rows.appendChild(tr);counter++;renumber();calc()}
function calc(){let r=Math.max(0,Number(rate.value)||0),sq=0,amt=0;[...rows.children].forEach(tr=>{let l=Math.max(0,Number(tr.querySelector('.len').value)||0),w=Math.max(0,Number(tr.querySelector('.wid').value)||0),q=Math.max(0,Number(tr.querySelector('.qty').value)||0),per=l*w/12,total=per*q,m=total*r;tr.querySelector('.per').textContent=per.toFixed(2);tr.querySelector('.sq').textContent=total.toFixed(2);tr.querySelector('.amt').textContent=money(m);sq+=total;amt+=m});document.getElementById('totalSqft').textContent=sq.toFixed(2);document.getElementById('grandTotal').textContent=money(amt);document.getElementById('summarySqft').textContent=sq.toFixed(2);document.getElementById('summaryAmount').textContent=money(amt)}
document.getElementById('addBtn').onclick=()=>addRow();document.getElementById('clearBtn').onclick=()=>{rows.innerHTML='';addRow()};document.getElementById('calcBtn').onclick=calc;rate.addEventListener('input',calc);addRow();addRow();
</script></body></html>
